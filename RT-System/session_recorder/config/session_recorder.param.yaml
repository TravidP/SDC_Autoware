session_recorder:
  ros__parameters:
    topics:
      - "/tf"
      - "/tf_static"
      - "/clock"
      - "/bool"

    # Namespaces under which to record topics
    namespaces:
      - "/robot1/second"
      - "/robot2"
      - "/robot3"

    # Output configuration
    output_directory: "./bags"
    bag_name_prefix: "session_recording"

    # Space monitoring (in GB)
    space_threshold_gb: 2.0      # Stop recording when less than 2GB available
    check_interval_seconds: 2.0   # Check disk space every 2 seconds

    # Auto-start recording when node launches
    auto_start: true
